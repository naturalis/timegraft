name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y vsearch
          pip install -e ".[dev]"
      - name: Lint workflow
        run: snakemake --lint
      - name: Dry run
        run: snakemake -n --cores 1
      - name: Tests, including the toy workflow end to end
        run: pytest -q
