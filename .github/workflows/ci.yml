name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          # VSEARCH from apt; if the Ubuntu mirrors cannot be reached, the release binary from GitHub
          if ! (sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=2 vsearch); then
            v=2.30.0
            curl -fsSL "https://github.com/torognes/vsearch/releases/download/v$v/vsearch-$v-linux-x86_64.tar.gz" | tar xz -C /tmp
            sudo cp "/tmp/vsearch-$v-linux-x86_64/bin/vsearch" /usr/local/bin/
          fi
          vsearch --version
          git clone --quiet https://github.com/tothuhien/lsd2.git /tmp/lsd2
          git -C /tmp/lsd2 checkout --quiet c61110f3a4fa05325b45c97b2134792ff9d55d4c
          make -s -C /tmp/lsd2/src && sudo cp /tmp/lsd2/src/lsd2 /usr/local/bin/
          pip install -e ".[dev]"
      - name: Lint workflow
        run: snakemake --lint
      - name: Dry run
        run: snakemake -n --cores 1
      - name: Tests, including the toy workflow end to end
        run: pytest -q
