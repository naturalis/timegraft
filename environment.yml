# The conda environment to run timegraft in: the package (installed in
# editable mode from this checkout), Snakemake, the external tools of the
# workflow and the test dependencies.
#
#   conda env create -f environment.yml
#   conda activate timegraft
#
# After a pull that changes this file:
#
#   conda env update -n timegraft -f environment.yml --prune
#
# The per-rule environments of `snakemake --use-conda` are in workflow/envs/
# and are separate from this one. Two optional methods are not covered here
# and need --use-conda: dating.method lsd2 (the build_lsd2 rule compiles LSD2
# with git, make and a C++ compiler) and dating.method chronos (R and ape).
name: timegraft
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - numpy >=1.24
  - dendropy >=4.6
  - python-duckdb >=1.0
  - matplotlib-base >=3.7
  - biopython >=1.80
  - snakemake-minimal >=8
  - pytest >=7
  - mafft
  - vsearch
  - curl                  # download_otol, download_otol_annotations
  - tar
  - pip
  - pip:
      - -e .
