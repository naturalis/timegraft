# timegraft configuration. Paths are relative to the working directory.

# Which marker block below to use.
marker: coi

# Inputs
records: tests/data/toy/records.tsv        # record_id, unit_id, genus, sequence
backbone: tests/data/toy/backbone.tre      # dated, ultrametric, genera at the tips, ages in Ma
                                           # (ignored when backbone_build.enabled is true)
crown_ages: tests/data/toy/crown_ages.tsv  # optional: genus, crown_age (Ma), e.g. from TimeTree
samples: tests/data/toy/samples.tsv        # optional: sample, unit_id, abundance; enables PD metrics

# Build the backbone from Open Tree of Life (topology) and TimeTree (ages)
# for all genera in the records, instead of reading it from a file.
backbone_build:
  enabled: false
  context: All life          # OToL TNRS context, e.g. Animals or Fungi, to avoid homonyms
  per_side: 2                # genera per child clade sent to TimeTree for each node
  root_age:                  # Ma; only needed if TimeTree has no age for the root
  cache: resources/api_cache.json

# Outputs
outdir: results/toy

# Genera are processed in this many parallel shards.
n_shards: 4

# Units from the sister genus used to root each genus subtree.
n_outgroup: 2

# Representative per unit
max_records_per_unit: 50   # records considered when choosing the medoid
genus_agreement: 0.8       # share of records that must agree on the genus

# Genera in the backbone without any units are removed from the output.
prune_empty: true

# Marker plug-ins. Everything outside this block is shared between markers.
markers:
  coi:
    filter:
      min_length: 200
      max_ambiguous: 0.01
      genetic_code: 5        # 5 invertebrates, 9 echinoderms and flatworms, 4 cnidarians
    align: none              # none (input already aligned) or mafft
    distance:
      method: k2p
    crown_age:
      method: rate           # used when crown_ages has no entry for a genus
      rate: 0.0115           # substitutions per site per Myr, per lineage (about 2.3% pairwise)
      cap_fraction: 0.9      # crown age never exceeds this fraction of the stem age

  its:
    filter:
      min_length: 100
      max_ambiguous: 0.01
    align: none              # k-mer distances need no alignment
    distance:
      method: kmer
      k: 8
    crown_age:
      method: fraction       # no reliable ITS rate: a stated fraction of the stem age
      fraction: 0.5
      cap_fraction: 0.9
