# timegraft configuration. Paths are relative to the working directory.

# Which marker block below to use.
marker: coi

# Inputs
records: tests/data/toy/records.tsv        # record_id, unit_id, genus, sequence

# Alternatively, read records straight from a BOLD data package (BCDM TSV);
# when bcdm.path is set it replaces `records`.
bcdm:
  path:                      # e.g. resources/BOLD_Public.tsv
  marker: COI-5P
  taxa:                      # rank: [names]; all must match
    # phylum: [Annelida, Mollusca, Arthropoda, Echinodermata, Cnidaria]
  countries: []              # country/ocean values, e.g. [Portugal, Spain]
backbone: tests/data/toy/backbone.tre      # dated, ultrametric, genera at the tips, ages in Ma
                                           # (ignored when backbone_build.enabled is true)
crown_ages: tests/data/toy/crown_ages.tsv  # optional: genus and crown_age (Ma, used as given) and/or
                                           # crown_age_min, crown_age_max (bounds on the age from the
                                           # barcodes); literature values: data/crown_ages/literature.tsv

# Diversity per sample. Give either a table of units per sample, or ASVs plus
# an ASV table: ASVs are then matched to units or placed on the tree first.
samples:                                   # optional: sample, unit_id, abundance
asvs: tests/data/toy/asvs.fasta            # optional: ASV sequences (FASTA)
asv_table: tests/data/toy/asv_table.tsv    # optional: sample, asv_id, reads

# Build the backbone from Open Tree of Life (topology) and TimeTree (ages)
# for all genera in the records, instead of reading it from a file.
backbone_build:
  enabled: false
  source: static             # static: OToL release files (downloaded once); api: OToL web API
  synthesis: opentree16.1    # static: synthesis release
  taxonomy: ott3.7.3         # static: OTT release
  otol_dir: resources/otol
  context: Metazoa           # taxon to search genera in, to avoid homonyms (e.g. Metazoa, Fungi)
  per_side: 2                # genera per child clade sent to TimeTree for each node
  species_per_genus: 3       # species ids sent along with each genus, as TimeTree misses many genera
  crown_ages_from_timetree: true  # static only: genus crown ages from TimeTree species
  root_age:                  # Ma; only needed if TimeTree has no age for the root
  interpolation: pure_birth  # nodes TimeTree does not date: pure_birth (by the number of genera in the
                             # full clade; static source only, otherwise even) or even (as BLADJ); #16
  cache: resources/api_cache.json

# Validation of the informative window: barcode distances against a trusted
# reference tree whose tips are unit ids, per taxonomic stratum. Rank columns
# (e.g. family, order) are read from the records when present.
validation:
  reference_tree: tests/data/toy/reference.tre   # leave empty to skip
  ranks: [genus, family, order]
  per_stratum: 200
  seed: 1
  methods:                   # label: distance method and its options
    k2p: {method: k2p}       # needs aligned sequences
    kmer: {method: kmer, k: 8}

# Outputs
outdir: results/toy

# Genera are processed in this many parallel shards.
n_shards: 4

# Rooting of genus subtrees (docs/science/results/2026-11-iberia.md, #19).
rooting:
  rule: tolerant             # tolerant: root on the edge with the fewest units on the wrong side;
                             # strict: the genus must be a clade with respect to the outgroup
  n_outgroup: 10             # outgroup units per genus
  outgroup_choice: spread    # spread: over the nearest sister clades, longest sequences first;
                             # sister: first units by id of the sister genus (before #19)
  outgroup_levels: 3         # spread: sister clades to draw from, going up the backbone
  fallback: mad              # without an outgroup, or when the strict rule fails: mad or midpoint
  uncertainty: true          # record in provenance.tsv how much crown age and PD depend on the root (#34)

# Representative per unit
max_records_per_unit: 50   # records considered when choosing the medoid
genus_agreement: 0.8       # share of records that must agree on the genus

# Genera in the backbone without any units are removed from the output.
prune_empty: true

# Units without a genus (or with conflicting genera) are placed next to their
# nearest unit in the finished tree, using the marker's placement settings.
place_unassigned_units: true

# Marker plug-ins. Everything outside this block is shared between markers.
markers:
  coi:
    filter:
      min_length: 200
      max_ambiguous: 0.01
      # Genetic code for the reading-frame check, resolved per record: a
      # genetic_code column in the records wins; otherwise, from genus up to
      # phylum, the first name in genetic_codes below or in the shipped
      # mapping (src/timegraft/data/genetic_codes.tsv); otherwise this default.
      genetic_code: 5        # NCBI table; 5 is the invertebrate mitochondrial code
      genetic_codes: {}      # rank: {name: code}, e.g. {class: {Ascidiacea: 13}}
      genetic_code_table:    # optional: your own name-to-code mapping instead of the shipped one
    align: none              # none (input already aligned) or mafft
    distance:
      method: k2p
    screening:               # set aside units that do not fit their genus before subtrees are built
      enabled: true
      margin: 0.02           # ... at least this much more similar to another genus than to any congener
      min_identity: 0.80     # ... or no congener at this identity (while the genus has units that do)
      query_cov: 0.7         # all-against-all search of the representatives with VSEARCH
    crown_age:
      method: rate           # used when crown_ages has no entry for a genus
      rate: 0.0115           # default rate: substitutions per site per Myr, per lineage (about 2.3%
                             # pairwise), within the range of COI rates from young splits; sets the
                             # lower bound of the crown age (see docs/technical/configuration.md)
      rates: {}              # rate per taxon, rank: {name: rate}, e.g. {class: {Teleostei: 0.0043}};
                             # resolved per genus from genus up to phylum, before the default
      rate_table:            # the same as a table (rank, name, rate), as written by timegraft.calibrate
      cap_fraction: 0.9      # crown age never exceeds this fraction of the stem age
      timetree_bound: max    # max: a TimeTree crown age is an upper bound on the age from the
                             # barcodes; none: TimeTree crown ages are not used
      estimate: minimum      # the age between the bounds: minimum (the age from the barcodes, which
                             # saturation makes a lower bound) or midpoint (geometric mean of the
                             # lower and upper bound)
    dating:
      method: mpl            # mpl (mean path length, built in), lsd2 (least squares, built from source)
                             # or chronos (penalised likelihood, needs R with ape; not the default, as
                             # it changes little within genera: docs/science/results/2026-11-dating.md)
      seq_length: 658        # lsd2: barcode length, used for its variance model
      # model: correlated    # chronos: correlated, relaxed, discrete or clock
      # lambda: 1            # chronos: smoothing parameter
    placement:
      match_identity: 0.97   # at or above: the ASV counts as the unit it matches
      place_identity: 0.80   # at or above: attached near its nearest unit; below: unplaced
      query_cov: 0.9         # share of the ASV that must align
      maxaccepts: 20
      height: rate           # attach at age (1 - identity) / (2 * rate), using crown_age.rate
      stem_fraction: 0.5     # units set aside by screening that match nothing: joined to the stem of
                             # their own genus, this fraction of the way from its crown to its stem node

  its:
    filter:
      min_length: 100
      max_ambiguous: 0.01
    align: none              # k-mer distances need no alignment
    distance:
      method: kmer
      k: 8
    screening:
      enabled: false         # identity thresholds not yet tested for ITS (#38)
    crown_age:
      method: fraction       # no reliable ITS rate: a stated fraction of the stem age
      fraction: 0.5
      cap_fraction: 0.9
      timetree_bound: max
    dating:
      method: mpl
      seq_length: 500
    placement:
      match_identity: 0.97
      place_identity: 0.80
      query_cov: 0.8
      maxaccepts: 20
      height: terminal       # no reliable rate: attach halfway along the nearest unit's terminal edge
      terminal_fraction: 0.5
